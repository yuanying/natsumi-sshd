# Builds the image and runs test/run.sh on every pull request and on main. A version tag (v1.2.3) also pushes
# ghcr.io/<owner>/natsumi-sshd:1.2.3 and :latest. Only tag pushes reach the package write permission.
# release.yml calls this with a version as well: a tag pushed by its GITHUB_TOKEN starts no workflow, so it pushes
# the image itself, from the commit it is about to tag, before the tag exists.
name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: The version to push the image as (v1.2.3).
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: natsumi-sshd:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: test/run.sh natsumi-sshd:test
        env:
          FETCH_URL: https://github.com/${{ github.repository_owner }}.keys

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/natsumi-sshd
          # v1.2.3 -> 1.2.3, and latest for a version without a pre-release part. The version is the pushed tag's,
          # or the one release.yml gives.
          tags: type=semver,pattern={{version}},value=${{ inputs.version || github.ref_name }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only: the nodes that run natsumi are all amd64.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
